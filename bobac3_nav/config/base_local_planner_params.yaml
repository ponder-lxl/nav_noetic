# TrajectoryPlannerROS:
#   max_vel_x: 0.2 
#   min_vel_x: 0.05

#   max_vel_theta:  0.4 
#   min_vel_theta: -0.4
#   min_in_place_vel_theta: 1.0

#   acc_lim_x: 0.4
#   acc_lim_y: 0.0 
#   acc_lim_theta: 0.2

#   xy_goal_tolerance: 0.20
#   yaw_goal_tolerance: 0.10

#   holonomic_robot: true

#   sim_time: 0.8
#   vx_samples: 18
#   vtheta_samples: 20
#   sim_granularity: 0.05


DWAPlannerROS:

  max_vel_x: 0.15
  min_vel_x: -0.15

  max_vel_y: 0.0
  min_vel_y: 0.0

  max_vel_trans:  0.15
  min_vel_trans:  0.05

  max_vel_theta: 0.6
  min_vel_theta: 0.0

  acc_lim_x: 0.5
  acc_lim_y: 0.0
  acc_lim_theta: 0.4

  xy_goal_tolerance: 0.20
  yaw_goal_tolerance: 0.20
  latch_xy_goal_tolerance: false

  sim_time: 2.0
  vx_samples: 20
  vy_samples: 0
  vth_samples: 40
  controller_frequency: 10.0

  path_distance_bias: 32.0
  goal_distance_bias: 20.0
  occdist_scale: 0.02
  forward_point_distance: 0.325
  stop_time_buffer: 0.2
  scaling_speed: 0.25
  max_scaling_factor: 0.2

  oscillation_reset_dist: 0.05

  publish_traj_pc : true
  publish_cost_grid_pc: true